name: Release

# Push a tag such as v0.1.0 and this builds, tests and publishes a GitHub release with a self-contained Windows zip.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build MasterHub.slnx --nologo -c Release
      - run: dotnet test MasterHub.slnx --nologo -c Release --no-build
      - name: Publish (self-contained, win-x64)
        shell: pwsh
        run: |
          dotnet publish src/MasterHub.Avalonia -c Release -r win-x64 --self-contained -o publish
          dotnet publish src/MasterHub.Cli -c Release -r win-x64 --self-contained -o publish
      - name: Package and release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          $zip = "MasterHub-$tag-win-x64.zip"
          Compress-Archive -Path publish\* -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Out-File -Encoding ascii "$zip.sha256"

          # Release notes = the matching section of CHANGELOG.md
          $lines = Get-Content CHANGELOG.md
          $start = ($lines | Select-String -Pattern "^## \[$([regex]::Escape($version))\]" | Select-Object -First 1).LineNumber
          $notes = @()
          if ($start) {
            for ($i = $start; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match '^## \[') { break }
              $notes += $lines[$i]
            }
          }
          if ($notes.Count -eq 0) { $notes = @("See CHANGELOG.md.") }
          $notes += ""
          $notes += "SHA-256 of the zip: ``$hash``"
          $notes | Set-Content release-notes.md -Encoding utf8

          $flags = @()
          if ($version.StartsWith('0.')) { $flags += '--prerelease' }
          gh release create $tag $zip "$zip.sha256" --title "MasterHub $version" --notes-file release-notes.md @flags
