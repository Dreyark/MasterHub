name: Cleanup old releases (one-off)

on:
  push:
    tags: ['cleanup-*']

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Delete the old releases together with their tags
        run: |
          for t in v0.1.0 v0.1.1; do
            gh release delete "$t" --yes --cleanup-tag || echo "could not delete release $t"
          done
      - name: Delete the tags that never got a release
        run: |
          for t in v0.1.2 v0.1.3; do
            gh api -X DELETE "repos/$GH_REPO/git/refs/tags/$t" || echo "could not delete tag $t"
          done
