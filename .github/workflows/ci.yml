name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'
      - run: dotnet build MasterHub.slnx --nologo -c Release
      - run: dotnet test MasterHub.slnx --nologo -c Release --no-build --logger "trx" --results-directory results
      - name: Show failed tests
        if: failure()
        shell: pwsh
        run: |
          # Failed tests become annotations on the run, so they can be read without opening the raw log.
          foreach ($f in Get-ChildItem results -Filter *.trx -ErrorAction SilentlyContinue) {
            [xml]$x = Get-Content $f.FullName
            $ns = New-Object Xml.XmlNamespaceManager($x.NameTable); $ns.AddNamespace('t', 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010')
            foreach ($r in $x.SelectNodes("//t:UnitTestResult[@outcome='Failed']", $ns)) {
              $msg = ($r.Output.ErrorInfo.Message + ' ' + $r.Output.ErrorInfo.StackTrace)
              if ($msg.Length -gt 900) { $msg = $msg.Substring(0, 900) }
              $msg = $msg -replace "`r", '' -replace "`n", ' | '
              Write-Output "::error title=$($r.testName)::$msg"
            }
          }
