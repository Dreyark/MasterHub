name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'
      - run: dotnet build MasterHub.slnx --nologo -c Release
      - name: Test
        shell: pwsh
        run: ./.github/scripts/run-tests.ps1
